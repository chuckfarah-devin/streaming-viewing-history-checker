[versions]
agp             = "8.5.2"
kotlin          = "2.0.21"
ksp             = "2.0.21-1.0.28"
hilt            = "2.52"
room            = "2.6.1"
compose-bom     = "2024.12.01"
coroutines      = "1.9.0"
lifecycle       = "2.8.7"
activity-compose = "1.9.3"
navigation-compose = "2.8.5"
fuzzywuzzy      = "1.4.0"
camerax         = "1.4.0"
mlkit-ocr       = "16.0.1"
junit           = "4.13.2"
junit-ext       = "1.2.1"
truth           = "1.4.4"
robolectric     = "4.12.2"
hilt-nav        = "1.2.0"

[libraries]
# Compose BOM
compose-bom             = { group = "androidx.compose", name = "compose-bom",              version.ref = "compose-bom" }
compose-ui              = { group = "androidx.compose.ui",   name = "ui" }
compose-ui-graphics     = { group = "androidx.compose.ui",   name = "ui-graphics" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-material3       = { group = "androidx.compose.material3", name = "material3" }
compose-ui-tooling      = { group = "androidx.compose.ui",   name = "ui-tooling" }
compose-ui-test-manifest = { group = "androidx.compose.ui",  name = "ui-test-manifest" }
compose-ui-test-junit4  = { group = "androidx.compose.ui",   name = "ui-test-junit4" }

# Lifecycle / Activity
lifecycle-runtime       = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx",        version.ref = "lifecycle" }
lifecycle-viewmodel     = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose",   version.ref = "lifecycle" }
activity-compose        = { group = "androidx.activity",  name = "activity-compose",             version.ref = "activity-compose" }

# Navigation
navigation-compose      = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation-compose" }

# Room
room-runtime            = { group = "androidx.room", name = "room-runtime",  version.ref = "room" }
room-ktx                = { group = "androidx.room", name = "room-ktx",      version.ref = "room" }
room-compiler           = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
room-testing            = { group = "androidx.room", name = "room-testing",  version.ref = "room" }

# Hilt
hilt-android            = { group = "com.google.dagger",   name = "hilt-android",          version.ref = "hilt" }
hilt-compiler           = { group = "com.google.dagger",   name = "hilt-android-compiler", version.ref = "hilt" }
hilt-navigation-compose = { group = "androidx.hilt",       name = "hilt-navigation-compose", version.ref = "hilt-nav" }

# Coroutines
coroutines-android      = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
coroutines-test         = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test",    version.ref = "coroutines" }

# Fuzzy matching
fuzzywuzzy              = { group = "me.xdrop", name = "fuzzywuzzy", version.ref = "fuzzywuzzy" }

# ML Kit OCR (bundled on-device model)
mlkit-text-recognition  = { group = "com.google.mlkit", name = "text-recognition", version.ref = "mlkit-ocr" }

# CameraX
camera-core             = { group = "androidx.camera", name = "camera-core",          version.ref = "camerax" }
camera-camera2          = { group = "androidx.camera", name = "camera-camera2",       version.ref = "camerax" }
camera-lifecycle        = { group = "androidx.camera", name = "camera-lifecycle",     version.ref = "camerax" }
camera-view             = { group = "androidx.camera", name = "camera-view",          version.ref = "camerax" }

# Testing
junit                   = { group = "junit",              name = "junit",              version.ref = "junit" }
junit-ext               = { group = "androidx.test.ext",  name = "junit",              version.ref = "junit-ext" }
truth                   = { group = "com.google.truth",   name = "truth",              version.ref = "truth" }
robolectric             = { group = "org.robolectric",    name = "robolectric",        version.ref = "robolectric" }

[plugins]
android-application     = { id = "com.android.application",            version.ref = "agp" }
kotlin-android          = { id = "org.jetbrains.kotlin.android",       version.ref = "kotlin" }
kotlin-compose          = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp                     = { id = "com.google.devtools.ksp",            version.ref = "ksp" }
hilt                    = { id = "com.google.dagger.hilt.android",     version.ref = "hilt" }
